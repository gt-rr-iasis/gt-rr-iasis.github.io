# ============================================================
# Identity
# ============================================================
name: "GT-RR-IASIS"                   # navbar brand and page titles
title: "Groupe de travail GdR IASIS"  # footer
institution: "CNRS"                   # footer
email: ""                             # contact address in the footer (hidden when empty)
logo: LOGO-GDR_IASIS_Print.png        # in images/, used as the social-sharing preview
favicon: "GT"                         # text drawn in favicon.svg

links:
  github: "https://github.com/gt-rr-iasis/"
  gdr: "https://gdr-iasis.cnrs.fr/"

# ============================================================
# Site settings
# ============================================================
accent_color: "#1a7a6d"      # theme color for links, buttons and favicon
dark_mode: true              # show dark mode toggle in navbar
description: "Website of the working group on reproducible research - GdR IASIS"
url: "https://gt-rr-iasis.github.io"
baseurl: ""

# Extra navbar entries after "Home". Each name must match the permalink of a
# page in _pages/, e.g. "- name: program" for a page with permalink /program/.
nav_pages: []

# ============================================================
# Build settings
# ============================================================
include:
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll-sitemap"]

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
